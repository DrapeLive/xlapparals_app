name: xlapparals_app
description: "A new Flutter project."
version: 1.0.0+2

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8
  dio: ^5.9.2
  connectivity_plus: ^7.1.1
  go_router: ^17.2.3
  flutter_bloc: ^9.1.1
  get_it: ^9.2.1
  flutter_secure_storage: ^10.3.1
  google_fonts: ^8.1.0
  intl: ^0.20.2
  equatable: ^2.0.8
  shared_preferences: ^2.5.5
  cached_network_image: ^3.4.1
  path_provider: ^2.1.5
  open_filex: ^4.7.0
  printing: ^5.14.3
  pdf: ^3.12.0
  file_saver: ^0.4.0
  share_plus: ^13.1.0
  camera: ^0.12.0+1
  google_mlkit_barcode_scanning: ^0.14.2
  audioplayers: ^6.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/icon/
    - assets/sounds/
    - assets/fonts/NotoSans-Regular.ttf
    - assets/fonts/NotoSans-Bold.ttf
  fonts:
    - family: PlusJakartaSans
      fonts:
        - asset: assets/fonts/PlusJakartaSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/PlusJakartaSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/PlusJakartaSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/PlusJakartaSans-Bold.ttf
          weight: 700

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon/icon.jpg"
  min_sdk_android: 21

flutter_native_splash:
  android: true
  ios: true
  color: "#FFFFFF"
  image: assets/icon/icon.jpg
  image_dark: assets/icon/icon.jpg
  image_android: assets/icon/icon.jpg
  image_dark_android: assets/icon/icon.jpg
  image_ios: assets/icon/icon.jpg
  image_dark_ios: assets/icon/icon.jpg

  android_gravity: center # bottom, center, center_horizontal, center_vertical,

  ios_content_mode: center # scaleToFill, scaleAspectFit, scaleAspectFill,

  fullscreen: true # default false

  android_12:
    # background color
    color: "#FFFFFF"

    image: assets/icon/icon.jpg
    image_dark: assets/icon/icon.jpg

    icon_background_color: "#FFFFFF"
    icon_background_color_dark: "#FFFFFF"
